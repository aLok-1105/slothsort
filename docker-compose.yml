services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
  backend:
    build: ./backend
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:270m
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - ollama
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  ollama_data:
